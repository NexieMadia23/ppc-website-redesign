{% load static %}<header class="site-header">
  <div class="header-main">
    <div class="container header-main__inner">
    {# Official city logo, downloaded from the live city site into static/img/. #}
    <a class="brand" href="{% url 'home' %}">
      <img class="brand__logo" src="{% static 'img/ppc-logo.png' %}" alt="" width="64" height="64">
      <span class="brand__text">
        <span class="brand__name">{{ SITE_NAME }}</span>
        <span class="brand__tag">The Official Website of the City Government</span>
      </span>
    </a>

    <div class="header-actions">
      <a class="header-cta" href="{% url 'sumbungan' %}">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-message"></use></svg>
        <span>Sumbungan</span>
      </a>
      <form class="search" role="search" action="{% url 'search' %}" method="get">
        <label class="visually-hidden" for="site-search">Search the site</label>
        <input id="site-search" type="search" name="q" placeholder="Search services, news, events" autocomplete="off">
        <button type="submit" class="btn btn--primary">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-search"></use></svg>
          <span class="visually-hidden">Search</span>
        </button>
      </form>
    </div>
    </div>
  </div>

  <nav id="primary-nav" class="site-nav on-dark" aria-label="Main">
    <ul class="container site-nav__list">
      {% for item in NAV_ITEMS %}
      <li><a href="{{ item.url }}"{% if item.is_current %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
